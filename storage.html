<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
  const KEY = "69x_potatoes_global_settings";
  let bc = null;
  try { bc = new BroadcastChannel("69x_global_channel"); } catch (e) {}

  function readData() {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    try {
      const match = document.cookie.match(new RegExp('(^| )' + KEY + '=([^;]+)'));
      if (match) return JSON.parse(decodeURIComponent(match[2]));
    } catch (e) {}
    return null;
  }

  function writeData(payload) {
    const existing = readData() || {};
    const merged = { ...existing, ...payload };
    const str = JSON.stringify(merged);
    try { localStorage.setItem(KEY, str); } catch (e) {}
    try {
      document.cookie = KEY + "=" + encodeURIComponent(str) + "; max-age=31536000; path=/; SameSite=None; Secure";
    } catch (e) {}
    if (bc) {
      try { bc.postMessage(merged); } catch (e) {}
    }
    return merged;
  }

  function sendToParent(type, payload) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: type, payload: payload }, "*");
    }
  }

  // Real-time sync across all open embeds & tabs!
  if (bc) {
    bc.onmessage = (e) => {
      if (e.data) sendToParent("LOADED_69X", e.data);
    };
  }

  window.addEventListener("storage", (e) => {
    if (e.key === KEY && e.newValue) {
      try { sendToParent("LOADED_69X", JSON.parse(e.newValue)); } catch (err) {}
    }
  });

  window.addEventListener("message", async (e) => {
    if (!e.data || !e.data.type) return;
    if (document.requestStorageAccess) {
      try { await document.requestStorageAccess(); } catch (err) {}
    }
    if (e.data.type === "SAVE_69X") {
      const updated = writeData(e.data.payload);
      if (e.source) e.source.postMessage({ type: "SAVED_69X", payload: updated }, "*");
    } else if (e.data.type === "LOAD_69X") {
      const saved = readData();
      if (e.source) e.source.postMessage({ type: "LOADED_69X", payload: saved }, "*");
    }
  });

  sendToParent("BRIDGE_READY_69X", readData());
</script>
</body>
</html>
